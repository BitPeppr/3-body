[build-system]
requires = ['setuptools >= 61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'trisolaris'
version = '0.1.3'
description = 'A highly customisable 3-body problem renderer, simulator, configuration-finder, and terminal visualiser written in Python.'
readme = 'README.md'
license = { file = 'LICENSE' }
requires-python = '>=3.10'
dependencies = ['numpy', 'scipy', 'matplotlib']
authors = [{ name = 'Martin Chen', email = 'martin.chen.au@gmail.com' }]
classifiers = [
  'Development Status :: 3 - Alpha',
  'Environment :: Console',
  'Intended Audience :: Science/Research',
  'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
  'Programming Language :: Python :: 3',
  'Topic :: Scientific/Engineering :: Physics',
]

[project.scripts]
trisolaris = 'trisolaris.main:main'

[project.optional-dependencies]
dev = ['twine', 'build']
